<!doctype html><meta charset=utf-8><title>Coil</title>
<style>html,body{margin:0;height:100%;background:#05060c;color:#f4f1e8;font:14px ui-monospace,monospace}canvas{display:block;margin:auto;background:#0a0e18}</style>
<canvas id=c width=480 height=480></canvas>
<script>
const c=document.getElementById("c"),g=c.getContext("2d"),N=20,S=24;
let dir={x:1,y:0},next=dir,snake,food,tick=0,live=1,score=0;
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=next={x:1,y:0};place();live=1;score=0;}
function place(){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}
reset();
addEventListener("keydown",e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};const k=m[e.key];if(k&&(k[0]!==-dir.x||k[1]!==-dir.y))next={x:k[0],y:k[1]};if(e.key===" ")reset();});
c.addEventListener("click",()=>{if(!live)reset();});
(function loop(){
  tick++;
  if(live&&tick%8===0){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))live=0;
    else{snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=1;place();}else snake.pop();}}
  g.fillStyle="#0a0e18";g.fillRect(0,0,480,480);
  g.fillStyle="#e8c872";g.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
  snake.forEach((s,i)=>{g.fillStyle=i? "#7dffc3":"#fff";g.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);});
  g.fillStyle="#e8c872";g.fillText("Coil  "+score+(live?"":"  space"),8,16);
  requestAnimationFrame(loop);
})();
</script>
