<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Cabinet</title>
<style>
:root{
  --wood:#3a2416; --gold:#e8c872; --mint:#7dffc3;
  --pink:#ff6ea8; --text:#f4f1e8; --dim:#8b90a8; --crt:#05060c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060a;color:var(--text);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
body{display:grid;place-items:center;background:
  radial-gradient(900px 400px at 50% -8%,#2a1a10,transparent 60%),
  repeating-linear-gradient(90deg,#0a090c 0 18px,#0e0c10 18px 36px)}
.cab{
  width:min(980px,100vw); height:min(100vh,1080px);
  display:grid; grid-template-rows:auto 1fr auto auto;
  background:linear-gradient(180deg,#4a2d1c,#2b1a10 18%,#1a100a);
  border:8px solid #120c08; border-radius:18px 18px 10px 10px;
  box-shadow:0 30px 80px #000c, inset 0 0 0 2px #6a4a30;
}
.marquee{
  background:linear-gradient(180deg,#1c1428,#0d0a16);
  border-bottom:4px solid #e8c87255; padding:10px 16px 12px; text-align:center;
  box-shadow:inset 0 -20px 40px #ff6ea822;
}
.marquee h1{margin:0;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(18px,4vw,32px);color:var(--gold);text-shadow:0 0 18px #e8c87288,0 0 40px #ff6ea844}
.marquee p{margin:4px 0 0;color:var(--dim);font-size:11px;letter-spacing:.08em}
.bezel{
  margin:10px 28px 0; background:#0b0c10; border:14px solid #15171f; border-radius:16px;
  box-shadow:inset 0 0 40px #000, 0 0 0 3px #2a2100; position:relative; overflow:hidden;
  min-height:0;
}
.glass{position:absolute;inset:0;pointer-events:none;z-index:3;background:
  linear-gradient(180deg,#fff2 0 2%,transparent 18% 82%,#0006),
  repeating-linear-gradient(180deg,transparent 0 2px,#0003 3px);
  mix-blend-mode:overlay; opacity:.55}
.crt{position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 80px #000c;border-radius:4px}
#screen{position:relative;z-index:1;height:100%;background:var(--crt);display:flex;flex-direction:column}
#screen.play iframe{flex:1;width:100%;border:0;background:#000;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px;overflow:auto;height:100%}
.cart{background:linear-gradient(180deg,#242844,#121426);border:2px solid #3a4068;border-radius:8px;padding:10px;cursor:pointer;color:inherit;font:inherit;text-align:left;min-height:112px}
.cart:hover,.cart:focus-visible{border-color:var(--gold);outline:none;box-shadow:0 0 16px #e8c87244}
.cart .tag{font-size:10px;letter-spacing:.16em;color:var(--mint)}
.cart h2{margin:6px 0 4px;font-size:14px}
.cart p{margin:0;color:var(--dim);font-size:11px}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0e1020;border-bottom:1px solid #2a2e48;font-size:12px}
button.nav,button.coin{background:#1c2140;color:var(--text);border:1px solid #3a4068;border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer}
button.coin{color:#0b0c14;background:var(--gold);border-color:#c9a44a;font-weight:700}
.panel{
  margin:8px 22px 6px; background:linear-gradient(180deg,#2a1c14,#18100c);
  border:3px solid #120c08; border-radius:12px; padding:10px 14px 12px;
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
}
.stick{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#444,#111);border:4px solid #222;position:relative}
.nub{position:absolute;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e8c872,#8a6a20);left:50%;top:50%;transform:translate(-50%,-50%)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{width:42px;height:42px;border-radius:50%;border:3px solid #111;cursor:pointer;color:#111;font-weight:800;font-size:11px}
.b1{background:#e23}.b2{background:#3ae23a}.b3{background:#3a7dff}.b4{background:#e8c872}
.coinrow{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.meter{font-size:11px;color:var(--gold);letter-spacing:.12em}
.kick{height:28px;margin:0 8px 8px;background:linear-gradient(#2a1a12,#120c08);border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;color:#6a5648;font-size:10px;letter-spacing:.2em}
.attract{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:#05060cee;text-align:center;cursor:pointer}
.attract.hide{display:none}
.attract h2{margin:0;color:var(--pink);letter-spacing:.2em;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.err{padding:24px;color:#ff6ea8;font-size:13px}
</style>
</head>
<body>
<div class="cab">
  <div class="marquee">
    <h1>VOIDD ARCADE</h1>
    <p>Original carts · cabinet shell · not a console emulator · no ROMs</p>
  </div>
  <div class="bezel">
    <div id="screen"></div>
    <div class="crt"></div>
    <div class="glass"></div>
    <div class="attract" id="attract"><div><h2>INSERT COIN</h2><p style="color:#8b90a8;font-size:12px">click screen / COIN / press 5</p></div></div>
  </div>
  <div class="panel">
    <div class="stick"><div class="nub" id="nub"></div></div>
    <div class="btns">
      <button class="btn b1" data-k="KeyZ">A</button>
      <button class="btn b2" data-k="KeyX">B</button>
      <button class="btn b3" data-k="KeyC">C</button>
      <button class="btn b4" data-k="Enter">ST</button>
    </div>
    <div class="coinrow">
      <div class="meter" id="credits">CREDITS 00</div>
      <button class="coin" id="coin">COIN</button>
    </div>
  </div>
  <div class="kick">JAMMA-ISH · YOUR GAMES · LOCAL CABINET</div>
</div>
<script>
const screen=document.getElementById("screen");
const attract=document.getElementById("attract");
const creditsEl=document.getElementById("credits");
const nub=document.getElementById("nub");
let carts=[], credits=0, frame=null, inGame=false;
function setCredits(n){ credits=Math.max(0,n); creditsEl.textContent="CREDITS "+String(credits).padStart(2,"0"); }
async function loadCarts(){
  const urls=["carts.json","/carts.json"];
  for(const u of urls){
    try{
      const r=await fetch(u,{cache:"no-store"});
      if(!r.ok) continue;
      const data=await r.json();
      if(Array.isArray(data)&&data.length) return data;
    }catch(e){}
  }
  return null;
}
async function shelf(){
  frame=null; inGame=false;
  screen.classList.remove("play");
  const data=await loadCarts();
  if(!data){
    screen.innerHTML='<div class="err">No carts.json. Run python start.py / server.py so this page is http://127.0.0.1:8933/</div>';
    return;
  }
  carts=data;
  screen.innerHTML=`<div class="grid">${carts.map(c=>`
    <button class="cart" data-href="${c.href}">
      <div class="tag">${c.tag}</div><h2>${c.title}</h2><p>${c.blurb}</p>
    </button>`).join("")}</div>`;
  screen.querySelectorAll(".cart").forEach(btn=>{
    btn.onclick=()=>{
      if(credits<1){ setCredits(0); creditsEl.animate([{color:"#ff6ea8"},{color:"#e8c872"}],{duration:280}); attract.classList.remove("hide"); return; }
      play(btn.dataset.href, btn.querySelector("h2").textContent);
    };
  });
}
function play(href,title){
  setCredits(credits-1);
  inGame=true;
  screen.classList.add("play");
  screen.innerHTML=`<div class="bar"><button class="nav" id="back" type="button">◀ CAB</button><span>${title}</span></div>
    <iframe id="game" src="${href}" title="${title}"></iframe>`;
  frame=document.getElementById("game");
  document.getElementById("back").onclick=shelf;
}
function insert(){ setCredits(credits+1); attract.classList.add("hide"); }
attract.onclick=insert;
document.getElementById("coin").onclick=insert;
function sendKey(code, type){
  try{ if(frame&&frame.contentWindow) frame.contentWindow.dispatchEvent(new KeyboardEvent(type,{code,bubbles:true})); }catch(e){}
}
document.querySelectorAll(".btn").forEach(b=>{
  b.onpointerdown=()=>sendKey(b.dataset.k,"keydown");
  b.onpointerup=()=>sendKey(b.dataset.k,"keyup");
});
const dirs={ArrowUp:[0,-10],ArrowDown:[0,10],ArrowLeft:[-10,0],ArrowRight:[10,0]};
window.addEventListener("keydown",e=>{
  if(e.code==="Digit5"||e.key==="5"){ insert(); return; }
  if(e.code==="Escape" && inGame){ e.preventDefault(); shelf(); return; }
  if(dirs[e.code]){ const [x,y]=dirs[e.code]; nub.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; }
});
window.addEventListener("keyup",e=>{ if(dirs[e.code]) nub.style.transform="translate(-50%,-50%)"; });
shelf();
</script>
</body>
</html>
